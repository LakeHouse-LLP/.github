name: Documentation
description: Improve docs, README, or templates
title: "[docs] "
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Fix typos, clarify CONTRIBUTING/AGENTS, or improve templates.
  - type: textarea
    id: location
    attributes:
      label: Where
      description: File path or URL of the docs to change
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
