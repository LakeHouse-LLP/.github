name: Bug report
description: Something is broken or incorrect
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include secrets or client content.
        Epics belong in [SenZhang-Todo](https://github.com/SenZhang-Plus/SenZhang-Todo).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, release, or commit SHA if known
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, environment (redact secrets)
