# Canonical labels for repos in this organization.
# Sync into each target repo via the reusable label-sync workflow
# (labels must exist in each repo; org defaults do not create them automatically).
# Owner/org login: prefer github.repository_owner / .lakehouse/org.json — do not hardcode.

- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: needs-triage
  color: "fbca04"
  description: Needs review / triage

- name: skip-changelog
  color: "c5def5"
  description: PR does not need a CHANGELOG or changeset entry
