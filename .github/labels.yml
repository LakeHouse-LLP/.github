# Canonical labels for LakeHouse-LLP repos.
# Sync into each target repo via the reusable label-sync workflow
# (labels must exist in each repo; org defaults do not create them automatically).

- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: needs-triage
  color: "fbca04"
  description: Needs review / triage

- name: skip-changelog
  color: "c5def5"
  description: PR does not need a CHANGELOG or changeset entry
