# Lightweight metadata check: when release-notes/ exists, version-bump PRs must
# touch it (or carry skip-release-notes). No paths-ignore — heavy CI may skip
# release-notes/** via paths-ignore; this workflow still covers those PRs.
# Public → ubuntu-latest. Private → self-hosted (never GitHub-hosted on private).

name: require-release-notes

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  require-release-notes:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        # pin: .lakehouse/pins.json → actions.checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release-notes on version bumps
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ ! -d release-notes ]; then
            echo "No release-notes/ directory — OK (check not applicable)"
            exit 0
          fi

          labels="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if printf '%s\n' "$labels" | grep -qx 'skip-release-notes'; then
            echo "skip-release-notes label present — OK"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "Changed files:"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '(^|/)release-notes/'; then
            echo "release-notes/ updated — OK"
            exit 0
          fi

          # Version / packaging bumps that usually need release notes.
          if printf '%s\n' "$changed" | grep -Eqi '(^|/)(package\.json|Directory\.Build\.props|.*\.csproj|.*\.nuspec|version\.json|VERSION)$|(^|/)\.changeset/'; then
            echo "::error::This PR looks like a version bump and release-notes/ exists — update release-notes/ or add skip-release-notes."
            exit 1
          fi

          echo "No version-bump paths and no release-notes/ changes required — OK"
