# Requires each PR to touch CHANGELOG.md / .changeset/ or carry skip-changelog.
# No branches filter — stacked PRs into feature branches must run this check.
# merge_group: required for public-repo merge queue checks (docs/merge-queue.md).
#
# Metadata-only: no paths-ignore (must still run when heavy CI skips docs-only PRs).
# Public → ubuntu-latest. Private → self-hosted (lightweight; never GitHub-hosted minutes).

name: changelog-check

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changelog:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        # pin: .lakehouse/pins.json → actions.checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changelog or skip-changelog label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          labels="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if printf '%s\n' "$labels" | grep -qx 'skip-changelog'; then
            echo "skip-changelog label present — OK"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "Changed files:"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '(^|/)CHANGELOG\.md$|(^|/)\.changeset/'; then
            echo "CHANGELOG or changeset updated — OK"
            exit 0
          fi

          echo "::error::PR must update CHANGELOG.md and/or .changeset/, or add the skip-changelog label."
          exit 1
