# README first paragraph + repo description/topics (8-20) via gh api.
# Public repos: GitHub-hosted. See docs/discoverability.md.
# pull_request with no branches filter — stacked PRs must run CI.
# merge_group: required for public-repo merge queue checks (docs/merge-queue.md).
#
# Touches README — no paths-ignore. Public ubuntu-latest; private self-hosted
# (lightweight Node script only; never GitHub-hosted minutes on private).

name: discoverability-check

on:
  pull_request:
  merge_group:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions: {}

jobs:
  discoverability:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Checkout
        # pin: .lakehouse/pins.json → actions.checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        # pin: .lakehouse/pins.json → actions.setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Ensure discoverability script
        env:
          OWNER: ${{ github.repository_owner }}
          DEFAULTS_REF: main
        run: |
          set -euo pipefail
          mkdir -p scripts docs
          base="https://raw.githubusercontent.com/${OWNER}/.github/${DEFAULTS_REF}"
          if [ ! -f scripts/discoverability-check.mjs ]; then
            curl -fsSL "${base}/scripts/discoverability-check.mjs" -o scripts/discoverability-check.mjs
          fi

      - name: Run discoverability check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/discoverability-check.mjs
