# Starter CI for public repos (GitHub-hosted runners).
# For private repos, change runs-on to your self-hosted labels and keep tier-guard.
# IMPORTANT: do not add a branches filter under pull_request — stacked PRs must get CI.
# merge_group: required for public-repo merge queue checks (docs/merge-queue.md).
# Pins: .lakehouse/pins.json — do not hardcode the GitHub org login.
#
# Queue relief (shared Windows self-hosted): concurrency cancels superseded PR runs;
# paths-ignore skips docs-only changes. Do not cancel in-progress on default-branch
# pushes (release tagging / publish). Keep require-release-notes as its own workflow
# so release-notes/** still get a check when heavy CI is skipped.

name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "release-notes/**"
  merge_group:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # pin: .lakehouse/pins.json → actions.checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (optional — remove if unused)
        # pin: .lakehouse/pins.json → actions.setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install & verify
        run: |
          set -euo pipefail
          # Customize for the target repo. This starter only auto-detects common Node layouts.
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm test
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
            yarn test
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
            npm test --if-present
            npm run lint --if-present
          elif [ -f package.json ]; then
            npm install
            npm test --if-present
            npm run lint --if-present
          else
            echo "No package.json — replace this step with language-specific build/test commands."
          fi
