# Private-repo release starter (self-hosted runners only).
# Same pipeline as release-public; runner tier differs. See docs/releasing.md.
# Never use this template on a public repository (tier-guard must fail).

name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "*@*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (annotated tag must already exist from CI)
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: [self-hosted]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        # pin: .lakehouse/pins.json → actions.checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        # pin: .lakehouse/pins.json → actions.setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Build
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run build
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
            npm run build --if-present
          elif [ -f package.json ]; then
            npm install
            npm run build --if-present
          else
            echo "Customize Build for this repo."
          fi

      - name: SHA256 checksums
        id: checksums
        run: |
          set -euo pipefail
          mkdir -p .release-assets
          shopt -s nullglob globstar
          count=0
          : > .release-assets/SHA256SUMS
          for f in dist/**; do
            if [ -f "$f" ]; then
              cp -a "$f" .release-assets/
              (cd .release-assets && sha256sum "$(basename "$f")" >> SHA256SUMS)
              count=$((count + 1))
            fi
          done
          echo "asset_count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then cat .release-assets/SHA256SUMS; else rm -f .release-assets/SHA256SUMS; fi

      - name: Attest build provenance
        if: ${{ steps.checksums.outputs.asset_count != '0' }}
        # pin: .lakehouse/pins.json → actions.attest-build-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .release-assets/*

      - name: Draft GitHub Release
        # pin: .lakehouse/pins.json → actions.gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            .release-assets/*

      - name: Publish npm (OIDC trusted publishing)
        if: ${{ hashFiles('package.json', 'pnpm-lock.yaml') != '' }}
        run: |
          set -euo pipefail
          echo "Skipping npm publish by default in the starter template."
          echo "Enable when private packages should publish (still prefer OIDC; no long-lived tokens)."
