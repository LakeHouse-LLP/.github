# Fails when the current GitHub org login (see .lakehouse/org.json orgName) is
# hardcoded outside the allowlist. Prefer org.json or github.repository_owner.
# Fetch policy files from the defaults repo — do not vendor shared libraries.
# pull_request with no branches filter — stacked PRs must run CI.

name: org-name-lint

on:
  pull_request:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

permissions: {}

jobs:
  org-name-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # pin: .lakehouse/pins.json → actions.checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure lint scripts from defaults repo
        env:
          OWNER: ${{ github.repository_owner }}
          DEFAULTS_REF: main
        run: |
          set -euo pipefail
          mkdir -p .lakehouse scripts
          base="https://raw.githubusercontent.com/${OWNER}/.github/${DEFAULTS_REF}"
          if [ ! -f scripts/org_name_lint.py ]; then
            curl -fsSL "${base}/scripts/org_name_lint.py" -o scripts/org_name_lint.py
            curl -fsSL "${base}/scripts/org-name-lint.sh" -o scripts/org-name-lint.sh
          fi
          if [ ! -f .lakehouse/org-name-lint-allowlist.txt ]; then
            curl -fsSL "${base}/.lakehouse/org-name-lint-allowlist.txt" -o .lakehouse/org-name-lint-allowlist.txt
          fi
          if [ ! -f .lakehouse/org.json ]; then
            curl -fsSL "${base}/.lakehouse/org.json" -o .lakehouse/org.json
          fi
          chmod +x scripts/org-name-lint.sh

      - name: Run org-name lint
        run: bash scripts/org-name-lint.sh
