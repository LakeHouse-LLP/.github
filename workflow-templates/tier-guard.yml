# Fails when runner tier does not match repo visibility.
# Public → github-hosted only. Private → self-hosted only.
# Keep pull_request without a branches filter so stacked PRs are checked.
# merge_group: required for public-repo merge queue checks (docs/merge-queue.md).
# Lightweight: no checkout. Concurrency cancels superseded PR runs (not default branch).

name: tier-guard

on:
  pull_request:
  merge_group:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions: {}

jobs:
  tier-guard:
    # Public: ubuntu-latest. Private: must set runs-on to self-hosted labels (never ubuntu).
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Enforce runner tier
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          env_kind="${RUNNER_ENVIRONMENT}"
          # Fallback when runner.environment is unavailable on older runners.
          if [ -z "${env_kind}" ]; then
            if [ -n "${ImageOS:-}" ]; then
              env_kind="github-hosted"
            else
              env_kind="self-hosted"
            fi
          fi
          echo "repository.private=${REPO_PRIVATE}"
          echo "runner.environment=${RUNNER_ENVIRONMENT:-<empty>}"
          echo "resolved.tier=${env_kind}"

          if [ "${REPO_PRIVATE}" = "false" ] || [ "${REPO_PRIVATE}" = "False" ]; then
            if [ "${env_kind}" = "self-hosted" ]; then
              echo "::error::Public repos must use GitHub-hosted runners. Self-hosted runners are never used on public repos."
              exit 1
            fi
            echo "OK: public repo on GitHub-hosted runner."
          else
            if [ "${env_kind}" = "github-hosted" ]; then
              echo "::error::Private repos must use self-hosted runners (not GitHub-hosted)."
              exit 1
            fi
            echo "OK: private repo on self-hosted runner."
          fi
